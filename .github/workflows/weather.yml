name: Daily Weather Tweet

on:
  schedule:
    # Fallback only. GitHub drops most scheduled runs under load, so an external
    # pinger triggers workflow_dispatch every 30 min; the gate job skips cron runs
    # while that is working. bot.py decides which runs post.
    - cron: '5,35 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the tweet without posting'
        type: boolean
        default: false

# Serialize runs so a cron run and a dispatched run never race on the Gist.
concurrency:
  group: weather-bot
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      # A cron run within 40 min of a dispatched run would make two near-simultaneous
      # runs count as the "two consecutive runs" that confirm severe alerts.
      - name: Skip cron run if the external trigger is working
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '40 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list -R "$GITHUB_REPOSITORY" --workflow weather.yml --event workflow_dispatch --limit 5 \
            --json createdAt,conclusion --jq "[.[] | select(.createdAt >= \"$since\" and .conclusion != \"failure\" and .conclusion != \"cancelled\")] | length")
          echo "dispatched runs in last 40 min: $recent"
          if [ "$recent" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

  tweet:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weather bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_SECRET: ${{ secrets.ACCESS_SECRET }}
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          WEATHERAPI_KEY: ${{ secrets.WEATHERAPI_KEY }}
          OPENWEATHER_KEY: ${{ secrets.OPENWEATHER_KEY }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python bot.py
